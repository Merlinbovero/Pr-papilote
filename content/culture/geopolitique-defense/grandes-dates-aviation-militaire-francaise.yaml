summary: >-
  Un fil chronologique de l'aviation militaire française — de sa naissance
  (1910-1912) à l'armée de l'Air et de l'Espace (2020), en passant par la
  création de l'armée de l'Air (1934), de l'ALAT (1954) et de la dissuasion
  nucléaire aéroportée (1964). Des repères de culture attendus au concours.
objectifs:
  - Situer les grandes étapes de l'aviation militaire française, de 1910 à nos jours.
  - Retenir les dates clés — 1912, 1934, 1954, 1964, 2020 — et ce que chacune fonde.
  - Comprendre comment chaque armée s'est dotée d'une composante aérienne propre.
