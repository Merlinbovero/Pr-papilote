content:
  essentiel:
    body: |
      L'aviation militaire française naît au **début du XXe siècle**, bien avant
      qu'existe une « armée de l'Air ». On peut retenir **cinq grandes étapes**.

      D'abord les **pionniers** : la loi du **29 mars 1912** crée
      l'**aéronautique militaire**, d'abord **rattachée à l'armée de terre** ;
      la **Première Guerre mondiale** (1914-1918) en fait un outil de combat, avec
      ses **escadrilles** et ses **as** (Guynemer, Fonck).

      Vient ensuite l'**autonomie** : le **2 juillet 1934**, l'**armée de l'Air**
      devient une **arme à part entière**, aux côtés de l'armée de terre et de la
      Marine. Après-guerre, l'**armée de terre** se dote de sa propre aviation
      avec la création de l'**ALAT** le **22 novembre 1954**.

      Puis la **dissuasion** : en **1964**, la **dissuasion nucléaire
      aéroportée** devient opérationnelle avec le bombardier **Mirage IV**.
      Enfin, l'**ère moderne** : le **Rafale** entre en service dans les années
      2000, et en **2020** l'armée de l'Air devient l'**armée de l'Air et de
      l'Espace**, intégrant explicitement le **domaine spatial**.
    aRetenir:
      - 29 mars 1912 — la loi crée l'aéronautique militaire, d'abord rattachée à l'armée de terre.
      - 2 juillet 1934 — l'armée de l'Air devient une arme à part entière.
      - 22 novembre 1954 — création de l'ALAT (aviation légère de l'armée de terre).
      - 1964 — la dissuasion nucléaire aéroportée devient opérationnelle (Mirage IV) ; 2020 — l'armée de l'Air devient l'armée de l'Air et de l'Espace.
  sections:
    - id: la-chronologie
      title: La chronologie en un coup d'œil
      body: |
        | Date | Événement |
        | --- | --- |
        | 1910 | Naissance de l'aviation militaire française (9 juin 1910). |
        | 1912 | La loi du 29 mars 1912 crée l'aéronautique militaire, rattachée à l'armée de terre ; premières escadrilles. |
        | 1914-1918 | Première Guerre mondiale : essor des escadrilles et des « as » (Guynemer, Fonck), escadrille des Cigognes. |
        | 1934 | L'armée de l'Air devient une arme à part entière (2 juillet 1934). |
        | 1954 | Création de l'ALAT — aviation légère de l'armée de terre (22 novembre 1954). |
        | 1964 | Dissuasion nucléaire aéroportée opérationnelle avec le Mirage IV (première alerte le 8 octobre 1964). |
        | 2020 | L'armée de l'Air devient l'armée de l'Air et de l'Espace. |
    - id: des-pionniers-a-l-autonomie
      title: Des pionniers à l'autonomie (1910-1934)
      body: |
        Les premiers avions militaires français apparaissent vers **1910**. La
        **loi du 29 mars 1912** institue l'**aéronautique militaire** : l'aviation
        est alors une **composante de l'armée de terre**, organisée en
        **escadrilles**.

        La **Première Guerre mondiale** transforme l'aviation en véritable **arme
        de combat** — reconnaissance, chasse, bombardement — et fait naître la
        légende des **as**, comme **Georges Guynemer** (escadrille des
        **Cigognes**) et **René Fonck**, le plus grand as allié de la guerre.

        L'expérience de la guerre montre que l'aviation mérite une **organisation
        propre**. Après la création d'un **ministère de l'Air** (1928), l'**armée
        de l'Air** devient une **arme à part entière le 2 juillet 1934**.
    - id: de-la-dissuasion-a-l-espace
      title: De la dissuasion à l'Espace (1954-2020)
      strate: maitriser
      body: |
        Après 1945, chaque armée consolide sa **composante aérienne**. L'**armée
        de terre** crée l'**ALAT** (aviation légère de l'armée de terre) le
        **22 novembre 1954**, pour l'observation puis, très vite, l'**hélicoptère**
        de manœuvre et de combat.

        La décennie suivante voit naître la **dissuasion nucléaire** : en
        **1964**, les **Forces aériennes stratégiques** mettent en service le
        bombardier **Mirage IV**, premier vecteur de la dissuasion **aéroportée**
        (première alerte opérationnelle le **8 octobre 1964**).

        À l'**époque contemporaine**, le **Rafale** — avion de combat polyvalent —
        entre en service dans la **Marine** au début des années 2000, puis dans
        l'**armée de l'Air en 2006**. En **2020**, pour tenir compte de
        l'importance croissante du **spatial militaire**, l'armée de l'Air devient
        l'**armée de l'Air et de l'Espace**.
  pieges:
    - L'armée de l'Air n'existe comme arme indépendante que depuis 1934 — avant, l'aviation était une composante de l'armée de terre.
    - « Aviation militaire » n'est pas « armée de l'Air » — l'aviation militaire naît vers 1910-1912, l'armée de l'Air en 1934.
    - L'ALAT (armée de terre) et l'aéronautique navale (Marine) sont distinctes de l'armée de l'Air — chaque armée a sa propre composante aérienne.
    - Depuis 2020, on dit « armée de l'Air et de l'Espace » — la dimension spatiale y est désormais explicite.
