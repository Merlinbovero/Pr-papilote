content:
  essentiel:
    body: |
      La défense de la France repose sur une **chaîne de responsabilité**
      claire, qui va du **pouvoir politique** au **commandement militaire**.

      Au sommet, le **Président de la République** est le **chef des armées**
      (article **15** de la Constitution) : il préside les conseils et comités
      supérieurs de la défense nationale, décide de l'**engagement des forces**
      et est le **seul** à pouvoir engager la **dissuasion nucléaire**. Le
      **Premier ministre**, lui, est **responsable de la défense nationale**
      (article **21**). Le **ministre des Armées** met en œuvre la politique de
      défense et **dirige** le ministère (budget, équipement, personnels).

      Côté militaire, le **chef d'état-major des armées** (**CEMA**), placé
      **sous l'autorité du Président et du gouvernement**, est **responsable de
      l'emploi des forces** et assure le **commandement des opérations
      militaires** ; il est aussi le **conseiller militaire du gouvernement**.

      Sous lui, les **trois armées** — **armée de Terre**, **Marine nationale**,
      **armée de l'Air et de l'Espace** — ont chacune leur **chef d'état-major**,
      chargé de **préparer** et d'**organiser** leur armée.
    aRetenir:
      - Le Président de la République est le chef des armées (art. 15) — il décide de l'engagement des forces et, seul, de la dissuasion nucléaire.
      - Le Premier ministre est responsable de la défense nationale (art. 21) ; le ministre des Armées dirige le ministère.
      - Le CEMA (chef d'état-major des armées) commande les opérations militaires et conseille le gouvernement.
      - Trois armées — Terre, Marine, Air et Espace — plus la Gendarmerie nationale (force armée, mais rattachée au ministère de l'Intérieur).
  sections:
    - id: la-chaine-de-decision-politique
      title: La chaîne de décision politique
      body: |
        La défense est d'abord une affaire **politique**. La Constitution
        répartit les rôles :

        | Autorité | Rôle | Référence |
        | --- | --- | --- |
        | Président de la République | Chef des armées ; engage les forces ; décide de la dissuasion nucléaire | Constitution, art. 15 |
        | Premier ministre | Responsable de la défense nationale | Constitution, art. 21 |
        | Ministre des Armées | Dirige le ministère : budget, équipement, personnels, préparation des forces | — |

        C'est aussi le Président qui **préside** le **Conseil de défense et de
        sécurité nationale** (**CDSN**), où sont arrêtées les grandes
        orientations de défense et de sécurité (opérations extérieures,
        renseignement, dissuasion). Le CDSN peut se réunir en formations
        spécialisées (conseil national du renseignement, conseil restreint…).
    - id: le-commandement-militaire-le-cema
      title: Le commandement militaire — le CEMA
      body: |
        Le **chef d'état-major des armées** (**CEMA**) est le **plus haut
        responsable militaire**. Placé **sous l'autorité du Président de la
        République et du gouvernement**, il est **responsable de l'emploi des
        forces** et assure le **commandement des opérations militaires** — c'est
        lui qui conduit, au quotidien, les opérations décidées par le pouvoir
        politique. Il est en outre le **conseiller militaire du gouvernement**.

        Les **chefs d'état-major des trois armées** relèvent de lui pour l'emploi
        opérationnel :

        - **CEMAT** — chef d'état-major de l'**armée de Terre** ;
        - **CEMM** — chef d'état-major de la **Marine** ;
        - **CEMAAE** — chef d'état-major de l'**armée de l'Air et de l'Espace**.

        Chacun **prépare** son armée (recrutement, formation, entraînement,
        équipement) et la met à disposition du CEMA pour les opérations.
    - id: les-forces-armees-et-la-gendarmerie
      title: Les forces armées et la gendarmerie
      body: |
        La France compte **trois armées**, auxquelles s'ajoute la **Gendarmerie
        nationale** — force armée à statut militaire, mais **rattachée au
        ministère de l'Intérieur** pour ses missions de sécurité :

        | Force | Milieu | Chef d'état-major |
        | --- | --- | --- |
        | Armée de Terre | Terrestre | CEMAT |
        | Marine nationale | Maritime | CEMM |
        | Armée de l'Air et de l'Espace | Aérien et spatial | CEMAAE |
        | Gendarmerie nationale | Sécurité intérieure et missions militaires | Directeur général (DGGN) |

        Au sein du ministère, la **Direction générale de l'armement** (**DGA**)
        conçoit et achète les **équipements** (avions, navires, missiles), tandis
        que le **secrétariat général pour l'administration** (**SGA**) gère les
        fonctions de soutien (juridique, finances, ressources humaines civiles).
    - id: la-dissuasion-nucleaire
      title: La dissuasion nucléaire
      strate: maitriser
      body: |
        Pilier de la défense française depuis les années 1960, la **dissuasion
        nucléaire** relève d'une décision **exclusivement présidentielle** : le
        chef de l'État est **seul** à pouvoir en ordonner l'emploi.

        Elle repose sur **deux composantes** complémentaires :

        - la **composante océanique** — les **sous-marins nucléaires lanceurs
          d'engins** (**SNLE**) de la Force océanique stratégique, capables de
          rester cachés en mer avec leurs missiles ;
        - la **composante aéroportée** — les **Forces aériennes stratégiques**
          (avions de combat porteurs d'un missile nucléaire), complétées par la
          composante embarquée de la Marine sur porte-avions.

        Savoir que la dissuasion est **permanente**, **présidentielle** et
        **à deux composantes** est un repère de culture attendu d'un futur
        officier.
  pieges:
    - Le chef des armées est le Président de la République — pas le ministre des Armées ni le CEMA.
    - Le CEMA commande les opérations ; le ministre dirige la politique et l'administration du ministère — ne pas confondre les deux rôles.
    - La Gendarmerie est une force armée, mais elle est rattachée au ministère de l'Intérieur (pas au ministère des Armées) pour son emploi.
    - La décision d'emploi de la dissuasion nucléaire appartient au seul Président — c'est une exclusivité, pas une décision collégiale.
