summary: >-
  Qui dirige les armées françaises ? Une chaîne claire, du politique au
  militaire — le Président chef des armées, le Premier ministre, le ministre des
  Armées, puis le chef d'état-major des armées (CEMA) qui commande les
  opérations. Un repère de culture institutionnelle attendu à l'entretien.
objectifs:
  - Restituer la chaîne de décision de la défense française, du Président de la République au chef d'état-major des armées.
  - Distinguer le rôle politique (Président, Premier ministre, ministre) du rôle militaire (CEMA, chefs d'état-major d'armée).
  - Situer les trois armées, la gendarmerie et les grands acteurs (CDSN, DGA) dans cet ensemble.
