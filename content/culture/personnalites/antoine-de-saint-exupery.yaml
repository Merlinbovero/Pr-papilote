  Aviateur de l'Aéropostale et grand écrivain, Antoine de Saint-Exupéry
  (1900-1944) a tiré de ses vols une œuvre majeure — « Vol de nuit », « Terre des
  hommes », « Le Petit Prince » — avant de disparaître en mission de
  reconnaissance en 1944.
