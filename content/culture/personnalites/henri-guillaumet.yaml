        | Spécialité | La ligne de la Cordillère des Andes |
    - id: le-rescape-des-andes
      title: Le rescapé des Andes (1930)
      body: |
        Franchir les **Andes** en avion, dans les années 1930, est l'une des
        épreuves les plus dures de « la Ligne » : des sommets de plusieurs
        **milliers de mètres**, un froid extrême, une météo brutale.

        Le 13 juin 1930, pris dans une **tempête de neige**, Guillaumet doit poser
        son **Potez 25** en catastrophe. Commence alors une **marche de survie**
        de **cinq jours** dans la montagne. Épuisé, il tient par pure **volonté**,
        se relevant sans cesse pour ne pas se laisser mourir dans le froid. Il est
        finalement **sauvé** — un exploit d'**endurance** entré dans la légende
        grâce au récit de **Saint-Exupéry**.
    - id: la-ligne-et-la-fin
      title: La Ligne et la fin
      strate: maitriser
      body: |
        Guillaumet incarne, plus encore que l'exploit, la **fidélité au devoir**
        et le **courage tranquille** du pilote de ligne. Ses camarades **Mermoz**
        et **Saint-Exupéry** en ont fait un modèle d'**amitié** et de
        **solidarité** entre aviateurs.

        Après l'Aéropostale, il vole pour **Air France**. Le **27 novembre 1940**,
        en pleine guerre, l'avion qu'il pilote entre **Marignane** et **Beyrouth**
        est **abattu** au-dessus de la **Méditerranée**. Avec lui disparaît le
        dernier des trois grands noms de « la Ligne ».
  pieges:
    - Guillaumet survit à son accident des Andes (1930) — ce n'est pas là qu'il meurt ; il est abattu en 1940 en Méditerranée.
    - Son exploit est une marche de survie (endurance), pas un record de vitesse ou de distance.
    - Il forme avec Mermoz et Saint-Exupéry le trio de « la Ligne », mais l'épisode des Andes lui est propre.
    - En 1940, il meurt dans un avion civil abattu par la guerre, et non au combat comme pilote militaire.
