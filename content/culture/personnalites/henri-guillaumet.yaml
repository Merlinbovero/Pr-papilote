content:
  essentiel:
    body: |
      **Henri Guillaumet** (1902-1940) est, avec **Mermoz** et **Saint-Exupéry**,
      l'une des trois grandes figures de « **la Ligne** » — l'aventure du
      **courrier aérien** de l'Aéropostale. Il en fut le **spécialiste de la
      Cordillère des Andes**, qu'il franchit des centaines de fois.

      Sa légende naît d'un **accident** : le **13 juin 1930**, son **Potez 25**
      se pose en catastrophe dans les **Andes**, en pleine tempête de neige. Donné
      pour **perdu**, Guillaumet **marche cinq jours et quatre nuits** dans le
      froid et l'altitude, refusant de se coucher pour ne pas mourir, jusqu'à être
      **secouru**. Saint-Exupéry immortalise l'épisode dans *Terre des hommes*, et
      rapporte sa phrase : « **Ce que j'ai fait, je te le jure, jamais aucune bête
      ne l'aurait fait.** »

      Passé à **Air France**, Guillaumet trouve la mort pendant la **Seconde
      Guerre mondiale** : le **27 novembre 1940**, son avion, reliant Marignane à
      Beyrouth, est **abattu** par un chasseur au-dessus de la **Méditerranée**.
    aRetenir:
      - Henri Guillaumet (1902-1940), pilote de l'Aéropostale, compagnon de Mermoz et Saint-Exupéry.
      - Célèbre pour sa survie dans les Andes en 1930 — cinq jours de marche dans la neige après un accident.
      - Saint-Exupéry rapporte sa phrase — « Ce que j'ai fait, jamais aucune bête ne l'aurait fait. »
      - Il est abattu en vol au-dessus de la Méditerranée le 27 novembre 1940.
  sections:
    - id: reperes
