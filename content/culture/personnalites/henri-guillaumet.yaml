      body: |
        | Repère | Détail |
        | --- | --- |
        | Naissance | 29 mai 1902, Bouy (Marne) |
        | Mort | 27 novembre 1940, abattu au-dessus de la Méditerranée, à 38 ans |
        | Compagnies | Latécoère, Aéropostale, Air France |
