  Pilote de l'Aéropostale et compagnon de Mermoz et Saint-Exupéry, Henri
  Guillaumet (1902-1940) est resté célèbre pour avoir survécu à un accident dans
  la Cordillère des Andes en 1930, marchant cinq jours dans la neige. Il est
  abattu en vol en 1940.
