  Pilote mythique de l'Aéropostale, Jean Mermoz (1901-1936), surnommé
  « l'Archange », a ouvert les grandes lignes du courrier aérien — la Cordillère
  des Andes, puis la première liaison postale de l'Atlantique Sud — avant de
  disparaître en mer à bord de la « Croix-du-Sud ».
