content:
  essentiel:
    body: |
      **Jean Mermoz** (1901-1936) est l'une des grandes figures de l'**épopée de
      l'Aéropostale**, cette aventure du **courrier aérien** qui, dans les années
      1920-1930, relia la France à l'Afrique et à l'Amérique du Sud. Pilote
      d'exception, surnommé « **l'Archange** », il incarne l'**esprit pionnier**
      de « la Ligne ».

      Entré chez **Latécoère** (devenue la **Compagnie générale aéropostale**),
      il ouvre des routes réputées impossibles : la traversée de la **Cordillère
      des Andes** (**1929**), puis, le **12-13 mai 1930**, la **première liaison
      postale de l'Atlantique Sud** — de **Saint-Louis du Sénégal** à **Natal**
      (Brésil), à bord de l'hydravion **Latécoère 28** « Comte-de-la-Vaulx », en
      un peu plus de **21 heures**.

      Le **7 décembre 1936**, à **34 ans**, il **disparaît** au-dessus de
      l'**Atlantique Sud** à bord de l'hydravion **Latécoère 300 « Croix-du-Sud »**,
      après avoir signalé une **avarie moteur**. Sa disparition en fait, comme
      Guynemer, une **légende** de l'aviation française.
    aRetenir:
      - Jean Mermoz (1901-1936) — pilote de l'Aéropostale, surnommé « l'Archange ».
      - Il ouvre la ligne des Andes (1929) et réalise la première liaison postale de l'Atlantique Sud (mai 1930).
      - Il vole pour Latécoère, puis la Compagnie générale aéropostale (« la Ligne »).
      - Il disparaît le 7 décembre 1936 à bord de l'hydravion « Croix-du-Sud ».
  sections:
    - id: reperes
      title: Repères
      body: |
        | Repère | Détail |
        | --- | --- |
        | Naissance | 9 décembre 1901, Aubenton (Aisne) |
        | Disparition | 7 décembre 1936, au-dessus de l'Atlantique Sud, à 34 ans |
        | Compagnie | Latécoère, puis Compagnie générale aéropostale |
        | Surnom | « L'Archange » |
        | Exploits | Traversée des Andes (1929) ; 1ʳᵉ liaison postale de l'Atlantique Sud (1930) |
