    - id: les-lignes
      title: Les lignes de l'Aéropostale
      body: |
        L'**Aéropostale** ne transporte pas d'abord des passagers, mais le
        **courrier** : il faut acheminer les lettres **toujours plus vite**, et
        **coûte que coûte**. Cela suppose de franchir des obstacles redoutables.

        Mermoz ouvre ainsi la ligne des **Andes** (1929), en faisant passer les
        avions au-dessus de sommets de plusieurs milliers de mètres. Puis il
        s'attaque à l'**Atlantique Sud** : le **12-13 mai 1930**, il relie
        **Saint-Louis du Sénégal** à **Natal** (Brésil) avec le courrier, à bord
        d'un hydravion **Latécoère 28**. Entre 1930 et 1936, il multipliera les
        **traversées** de l'Atlantique Sud.
    - id: la-legende
      title: La légende de la Croix-du-Sud
      strate: maitriser
      body: |
        Le **7 décembre 1936**, l'hydravion **« Croix-du-Sud »** décolle de Dakar
        pour l'Amérique du Sud. Peu après, Mermoz signale une **avarie** à un
        moteur, puis le contact est perdu : l'appareil et son équipage
        **disparaissent** en mer.

        Comme Guynemer, Mermoz devient un **héros national**, symbole du
        **courage** et du **sens du devoir**. Il partage cette légende de « la
        Ligne » avec d'autres pilotes fameux — **Antoine de Saint-Exupéry** et
        **Henri Guillaumet** — dont les récits ont fait entrer l'Aéropostale dans
        la **culture** française. Un bel exemple de l'esprit d'**équipe** et de
        **dépassement** attendu d'un futur pilote.
  pieges:
    - Mermoz a réussi la première liaison postale de l'Atlantique Sud (transport du courrier), pas la toute première traversée aérienne de cet océan — c'est une nuance classique.
    - L'Aéropostale est une compagnie civile de transport du courrier, pas une unité militaire — même si elle a forgé un esprit « pionnier ».
    - La « Croix-du-Sud » est l'hydravion de sa disparition (1936) ; l'avion de la traversée de 1930 était un Latécoère 28 (« Comte-de-la-Vaulx »).
    - Mermoz partage la légende de « la Ligne » avec Saint-Exupéry et Guillaumet — mais chacun a son histoire propre.
