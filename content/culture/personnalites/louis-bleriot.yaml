content:
  essentiel:
    body: |
      **Louis Blériot** (1872-1936) est l'un des **pères de l'aviation**. Le
      **25 juillet 1909**, il réalise la **première traversée de la Manche** en
      avion : parti des **Baraques** (près de **Calais**), il se pose à
      **Douvres**, en Angleterre, après environ **37 minutes** de vol, aux
      commandes de son monoplan **Blériot XI** (moteur Anzani).

      L'exploit fait de lui une **gloire mondiale** et lui vaut le **prix de
      1 000 livres** offert par le journal britannique *Daily Mail*. Surtout, il a
      une portée **symbolique** énorme : l'avion vient de franchir une **frontière
      naturelle**, et le Royaume-Uni n'est plus une île à l'abri des airs.

      Blériot n'est pas qu'un pilote : c'est aussi un **ingénieur** et un
      **industriel**. Son **Blériot XI**, monoplan à hélice tractive, préfigure
      l'avion moderne ; il fonde **Blériot Aéronautique**, qui construira des
      **milliers d'avions**. Il détient aussi le **brevet de pilote n°1** délivré
      en France.
    aRetenir:
      - Louis Blériot (1872-1936), aviateur, ingénieur et constructeur d'avions.
      - Première traversée de la Manche en avion le 25 juillet 1909 (Calais → Douvres, ~37 min) sur le Blériot XI.
      - L'exploit lui vaut le prix de 1 000 livres du Daily Mail et une renommée mondiale.
      - Il fonde Blériot Aéronautique et détient le brevet de pilote n°1 en France.
