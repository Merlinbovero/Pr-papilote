    - id: la-manche
      title: La traversée de la Manche (1909)
      body: |
        Au début du XXe siècle, la **Manche** est un défi symbolique : la franchir
        en avion prouverait que la mer n'arrête plus la machine volante. Plusieurs
        aviateurs s'y préparent, attirés par le **prix** du *Daily Mail*.

        Le **25 juillet 1909**, malgré une jambe brûlée lors d'un vol précédent et
        un moteur fragile, Blériot décolle près de **Calais** et rejoint
        **Douvres** en une trentaine de minutes, sans instruments de navigation.
        L'exploit fait la **une** des journaux du monde entier et marque le début
        d'une **nouvelle ère** — celle où les distances, et les frontières, se
        mesurent aussi dans les airs.
    - id: l-ingenieur-et-le-constructeur
      title: L'ingénieur et le constructeur
      strate: maitriser
      body: |
        Avant même la Manche, Blériot avait fait fortune dans les **phares
        d'automobiles**, ce qui lui permit de **financer** ses recherches
        aéronautiques. Son **Blériot XI** — un **monoplan** à hélice à l'avant —
        s'impose comme une configuration d'avenir, à une époque où beaucoup
        misaient encore sur les biplans.

        Après 1909, il devient un grand **constructeur** : **Blériot
        Aéronautique** produit des milliers d'appareils, notamment pendant la
        **Première Guerre mondiale**, et absorbe la firme **SPAD** en 1921. De
        l'exploit sportif à l'industrie, Blériot incarne la **naissance** de
        l'aviation française.
  pieges:
    - Blériot traverse la Manche (1909) — à ne pas confondre avec la Méditerranée (Garros, 1913) ni l'Atlantique (Lindbergh, 1927).
    - Le Blériot XI est un monoplan (une seule aile), pas un biplan.
    - Blériot n'est pas seulement un pilote — c'est aussi un ingénieur et un industriel de l'aviation.
    - Le prix récompensant la traversée était offert par un journal britannique, le Daily Mail.
