  Pionnier de l'aviation, Roland Garros (1888-1918) réussit la première
  traversée aérienne de la Méditerranée en 1913 et met au point le tir à travers
  l'hélice en 1915, avant de tomber au combat en 1918. Le stade de tennis
  parisien porte son nom.
