            assumptions:
              - Écoulement incompressible — la forme simplifiée cesse d'être exacte dès que la compressibilité intervient.
              - Prise statique non perturbée par l'écoulement local autour du fuselage (erreur de statique, FR-01 §4).
              - "Tube de Pitot aligné sur l'écoulement relatif : incidence et dérapage faibles."
              - Masse volumique prise à sa valeur en atmosphère standard — c'est pourquoi l'instrument affiche une vitesse indiquée, non une vitesse propre.
              - "Circuit non obstrué : ni givrage, ni eau, ni corps étranger dans les prises ou les canalisations."
            validityDomain: >-
              Écoulement incompressible, environ jusqu'à 250 kt. FR-01 énonce que la vitesse
              relève en subsonique de la relation de Saint-Venant, « bien approximée jusqu'à
              250 kt par la relation de Bernoulli » : la forme simplifiée n'est donc pas la loi
              du régime subsonique, mais une approximation dont la source donne la portée. Aux
              très basses vitesses, l'écart de pression devient trop faible pour être mesuré
              utilement (N-05).
            longDescription: >-
              Couche P2, volontairement hors du dessin pour préserver la lisibilité mobile.
              La prise de pression totale capte Pt = Ps + q ; les prises statiques captent Ps
              seule. Leur différence isole la pression dynamique q = Pt − Ps, exprimée en
              pascals. Sous les hypothèses ci-dessus, la vitesse s'en déduit par
              V = racine de (2q / rho), avec rho la masse volumique de l'air en kilogrammes
              par mètre cube et V en mètres par seconde. Trois distinctions que le dessin
              porte et que cette note explicite. Premièrement, la sonde Pitot ne mesure pas
              une vitesse : elle fournit une pression, et la vitesse en est déduite dans un
              modèle, après étalonnage de l'instrument et de son installation — c'est
              pourquoi l'anémomètre affiche une vitesse indiquée, non une vitesse propre.
              Deuxièmement, l'altimètre exploite la pression statique et affiche une
              altitude-pression, c'est-à-dire une altitude relative à un calage, non une
              hauteur mesurée. Troisièmement, le variomètre n'observe pas un déplacement
              vertical : il exploite l'écart entre la pression statique reçue directement et
              cette même pression retardée par une fuite calibrée, et c'est le régime de cet
              écart qui est gradué en pieds par minute (F-02, p. 8-7). Le principe interne des
              instruments — capsules anéroïdes, diaphragme, fuite calibrée — a été
              volontairement écarté du croquis : il relève d'une figure distincte, et
              l'ajouter ici aurait transformé une chaîne fonctionnelle en vue de maintenance.
    - id: obstructions-et-securite
      title: Obstructions et sécurité
      strate: maitriser
      body: |
        Ces prises exposées à l'air extérieur peuvent se **boucher** — et une
        prise obstruée fausse gravement les instruments.

        - Le **givrage** est le principal danger : par temps froid et humide, de
          la glace peut obturer le Pitot ou la prise statique. Les avions en sont
          protégés par un **réchauffage Pitot** (une résistance chauffante),
          enclenché en conditions givrantes.
        - Un **corps étranger** (insecte, eau, cache oublié) produit le même
          effet.
        - En cas de statique bouchée, une **source statique de secours** peut
          être sélectionnée.

        Si le **Pitot** est obstrué, l'**anémomètre** devient faux ; si la
        **statique** est obstruée, **trois** instruments se dérèglent à la fois.
        D'où l'importance de la **visite prévol** et du **réchauffage Pitot**.
  pieges:
    - Le tube de Pitot mesure la pression totale (statique + dynamique), pas la seule pression dynamique.
    - L'altimètre et le variomètre n'utilisent que la pression statique — seul l'anémomètre utilise aussi le Pitot.
    - Une prise statique bouchée fausse trois instruments d'un coup (altimètre, variomètre, anémomètre) — d'où la vigilance prévol.
