summary: >-
  Contrairement au turboréacteur, qui produit une poussée, le turbomoteur
  produit de la puissance sur un arbre : c'est le cœur des hélicoptères, dont le
  rotor est une aile tournante. Turbine libre, anti-couple, autorotation — les
  clés de la « voilure tournante ».
objectifs:
