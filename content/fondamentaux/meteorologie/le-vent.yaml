            assumptions:
              - Vent uniforme et constant sur le segment considéré.
              - Vitesse propre constante.
              - "Construction dans le plan horizontal : ni montée, ni descente."
              - Cap et route exprimés dans le même repère — ici le Nord vrai, pour les deux.
              - Valeurs de l'exemple construites pour la démonstration, non mesurées.
            validityDomain: >-
              Navigation à l'estime en vol horizontal, vent homogène sur le segment. La
              construction ne dit rien d'un vent tournant ni d'un profil de vent variable avec
              l'altitude. Elle est menée entièrement en valeurs vraies : ni magnétique, ni
              compas, ni déclinaison, ni déviation n'y interviennent — ces corrections
              relèvent d'un autre croquis.
            longDescription: >-
              Couche P2, déportée hors du dessin pour préserver la lisibilité mobile.
              Convention d'axes retenue : l'axe est compté positivement vers l'est, l'axe nord
              positivement vers le nord, et tout relèvement est exprimé en degrés vrais mesurés
              depuis le Nord dans le sens horaire. Les composantes de l'exemple construit sont
              alors les suivantes. Vitesse propre, cap 090 degrés, 120 nœuds : composantes est
              120 et nord 0. Vent venant du 360 degrés à 30 nœuds, donc se déplaçant vers le
              180 : composantes est 0 et nord moins 30. Somme : composantes est 120 et nord
              moins 30. La norme vaut racine de la somme des carrés de 120 et de 30, soit
              racine de 15 300, c'est-à-dire 123,69 nœuds, arrondis à 124 sur le dessin. Le
              relèvement vaut 90 degrés plus l'arc tangente de 30 sur 120, soit 104,04 degrés,
              arrondis à 104. La dérive est la différence entre la route et le cap, soit 14,04
              degrés, arrondis à plus 14 : le vent venant de la gauche, l'avion dérive vers la
              droite, et Route égale Cap plus Dérive. L'échelle du tracé est de 1,6 unité de
              dessin par nœud, commune aux trois vecteurs — c'est cette échelle unique qui rend
              la construction mesurable, et non seulement illustrative.
    - id: decoller-et-se-diriger-avec-le-vent
      title: Décoller et se diriger avec le vent
      strate: maitriser
      body: |
        Deux conséquences pratiques.

        **Au décollage et à l'atterrissage**, on se place **face au vent**. Le
        vent de face **ajoute** sa vitesse à celle de l'air sur l'aile : l'avion
        atteint sa portance à une **vitesse sol plus faible**, ce qui
        **raccourcit** la distance nécessaire. C'est pourquoi la piste en service
        change selon le vent.

        **En navigation**, le vent de travers oblige à **corriger le cap** : le
        pilote « pointe » légèrement le nez **vers le vent** pour que sa **route**
        réelle reste la bonne. Cette correction — la **dérive** — sera calculée
        dans la fiche « Cap, route et dérive ».

        À plus grande échelle, le vent n'est pas exactement dirigé des hautes vers
        les basses pressions : la **rotation de la Terre** (force de Coriolis) le
        **dévie**, si bien qu'en altitude il souffle presque **parallèlement aux
        isobares**. Ce raffinement est simplement introduit ici.
  pieges:
    - Le vent est nommé par la direction d'où il vient — un « vent d'ouest » souffle depuis l'ouest, vers l'est.
    - Ne pas confondre vitesse propre (dans l'air) et vitesse sol (par rapport au sol) — le vent fait toute la différence.
    - On décolle et on atterrit face au vent, jamais vent arrière — le vent de face réduit la distance nécessaire.
