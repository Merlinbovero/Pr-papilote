summary: >-
  Repérer le plus grand ou le plus petit nombre le plus vite possible : un test
  de vitesse perceptive, proche du traitement rapide des paramètres en vol. La
  méthode fiable est de comparer chiffre par chiffre, de gauche à droite.
objectifs:
  - Comparer rapidement des nombres de plusieurs chiffres.
  - Appliquer la comparaison chiffre par chiffre, de gauche à droite.
  - Gérer le cas des nombres négatifs (le plus grand est le plus proche de zéro).
