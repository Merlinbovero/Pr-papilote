content:
  essentiel:
    body: |
      Certains tests mesurent moins le raisonnement que la **vitesse de
      traitement** : parmi une poignée de nombres, désigner **le plus grand** ou
      **le plus petit** en quelques secondes. C'est une aptitude proche de celle
      du pilote qui balaie ses instruments et repère d'un coup la valeur
      critique.

      La règle est simple mais doit devenir **automatique** :

      - comparez d'abord le **nombre de chiffres** (999 > 87) ;
      - à nombre de chiffres égal, comparez **chiffre par chiffre à partir de la
        gauche** — le premier écart tranche ;
      - avec des **négatifs**, tout s'inverse : le plus grand est celui **le plus
        proche de zéro**.

      L'ennemi, c'est la **précipitation** : sous pression, on lit mal un chiffre
      ou on inverse deux nombres proches.
    aRetenir:
      - "Comparer d'abord le nombre de chiffres, puis chiffre par chiffre de gauche à droite."
      - Le premier chiffre qui diffère (en partant de la gauche) tranche la comparaison.
      - "Nombres négatifs — le plus grand est le plus proche de zéro (−3 > −12)."
      - La vitesse vient de l'entraînement ; la précipitation fait inverser deux nombres proches.
  sections:
    - id: la-methode
      title: La méthode chiffre par chiffre
      body: |
        Pour des nombres à même longueur, ne lisez pas la valeur entière :
        comparez **position par position**, de la gauche vers la droite. Dès que
        deux chiffres diffèrent, la comparaison est **tranchée** — inutile de
        lire la suite.

        Exemple : entre **472** et **479**, les centaines (4) et les dizaines (7)
        sont égales ; c'est l'unité (2 contre 9) qui décide : **479** est le plus
        grand.

        Quand les nombres n'ont pas la même longueur, le plus **long** l'emporte
        (pour des entiers positifs) : **1 003 > 998**.
    - id: le-piege-des-negatifs
      title: Le piège des négatifs
      strate: maitriser
      body: |
        Avec des nombres **négatifs**, l'intuition trompe : **−3 est plus grand
        que −12**, alors que 12 est plus grand que 3. Le plus grand négatif est
        celui dont la **valeur absolue est la plus petite** (le plus proche de
        zéro).

        Le réflexe : sur une **droite graduée** mentale, « plus grand » veut
        toujours dire « **plus à droite** » — donc, pour les négatifs, le plus
        proche de zéro.
    - id: le-test-de-codage
      title: Le test de codage
      strate: maitriser
      body: |
        Le **codage** du TAMI-C (sélections EOPN) pousse la même aptitude un
        cran plus loin. Une **grille de mots** est affichée, chacun associé à un
        **code à quatre chiffres** ; la grille ne change pas de toute l'épreuve.
        On demande un mot, il faut désigner son code parmi **cinq
        propositions** — **45 questions en 2 min 30**, soit 3,3 secondes
        l'unité.

        Le piège tient en une phrase : **les cinq codes proposés viennent tous
        de la grille**. Aucun n'est inventé, donc aucun ne s'élimine parce
        qu'il « n'existe pas ». Et ils se ressemblent — on trouve 1985, 1988,
        1485 et 1785 dans la même grille. C'est exactement là que la
        comparaison chiffre par chiffre, de gauche à droite, fait la
        différence.

        La boucle qui marche, toujours dans cet ordre :

        1. **lire le mot demandé** en entier, pas sa silhouette — « portier »
           et « portique » ne se distinguent qu'à la fin ;
        2. **descendre la colonne** où il se trouve plutôt que balayer toute la
           grille : la position se mémorise vite ;
        3. **lire le code de gauche à droite**, et ne le relâcher qu'une fois
           cliqué ;
        4. **ne pas revenir en arrière**. À 3,3 secondes, une question perdue
           coûte moins qu'un doute entretenu.

        Ce n'est pas une épreuve de mémoire : la grille reste sous les yeux. La
        mémoire ne fait qu'accélérer — au fil des questions, on cesse de
        chercher les mots les plus fréquents, on sait où ils sont.

        Le **débit compte autant que la justesse** : les questions non traitées
        comptent comme fausses. Mieux vaut un rythme régulier légèrement
        imparfait qu'une précision lente.
  pieges:
    - Ne pas lire le nombre entier — comparer chiffre par chiffre, de gauche à droite.
    - "Négatifs — le plus grand est le plus proche de zéro (−3 > −12), contre-intuitif."
    - "À nombre de chiffres égal, le premier écart de gauche tranche ; le reste est inutile."
    - La précipitation fait inverser deux nombres proches — ralentir un instant sur les valeurs voisines.
    - "Codage — reconnaître un mot à sa silhouette fait lire la mauvaise ligne : « portier » et « portique » ne se séparent qu'à la fin."
    - "Codage — revenir sur une question déjà passée coûte plus cher que de la laisser fausse : le temps est la ressource rare."
