content:
  essentiel:
    body: |
      Le calcul mental des sélections ne demande pas d'être un prodige — il
      demande des **automatismes**. Trois piliers :

      - **Décomposer** — 47 + 38 se calcule 47 + 40 − 2 = 85 ; 63 × 9 se
        calcule 63 × 10 − 63 = 567.
      - **Pourcentages malins** — 10 % s'obtient en décalant la virgule ;
        tout le reste s'assemble (15 % = 10 % + 5 % ; 5 % = la moitié de
        10 %).
      - **Temps-vitesse-distance** — d = v × t, avec le réflexe du
        **facteur de base** : la vitesse en unités **par minute** (120 kt =
        2 NM/min ; 300 km/h = 5 km/min).

      La vitesse vient de la **pratique quotidienne** — quelques minutes par
      jour, sans calculatrice, suffisent à transformer ses performances en
      quelques semaines.
    aRetenir:
      - Décomposer systématiquement — arrondir puis corriger (+ 38 = + 40 − 2).
      - 10 % = décaler la virgule ; construire 15 %, 20 %, 5 % à partir de 10 %.
      - d = v × t — convertir la vitesse en unités par minute (120 kt = 2 NM/min).
      - Multiplier par 5 = multiplier par 10 puis diviser par 2 (et ×25 = ×100 ÷ 4).
  sections:
    - id: techniques-de-base
      title: Les techniques de base
      body: |
        **Addition/soustraction** — arrondir puis corriger :
        56 + 29 = 56 + 30 − 1 = 85 ; 82 − 47 = 82 − 50 + 3 = 35.

        **Multiplication** — passer par les dizaines et les compléments :

        - ×5 → ×10 puis ÷2 (48 × 5 = 480 ÷ 2 = 240) ;
        - ×25 → ×100 puis ÷4 (32 × 25 = 3200 ÷ 4 = 800) ;
        - ×9 → ×10 moins une fois (74 × 9 = 740 − 74 = 666) ;
        - ×11 → ×10 plus une fois (43 × 11 = 430 + 43 = 473) ;
        - décomposer — 17 × 6 = (10 + 7) × 6 = 60 + 42 = 102.

        **Division** — simplifier d'abord : 540 ÷ 12 = 270 ÷ 6 = 45.

        **Ordres de grandeur** — avant tout calcul, estimer le résultat ; en
        QCM, l'estimation élimine souvent trois réponses sur quatre.
    - id: pourcentages-et-proportions
      title: Pourcentages et proportions
      body: |
        Tout se construit à partir de **10 %** (virgule décalée) et de
        **1 %** (deux décalages) :

        - 15 % de 260 → 26 + 13 = 39 ;
        - 30 % de 180 → 18 × 3 = 54 ;
        - 4 % de 350 → 3,5 × 4 = 14.

        **Proportions** — passer par l'**unité** : si 6 articles coûtent 90 €,
        un article coûte 15 €, donc 9 articles coûtent 135 €. Ce « retour à
        l'unité » résout la quasi-totalité des problèmes de règle de trois
        sans poser de fraction.

        Attention aux **évolutions successives** — +10 % puis −10 % ne
        revient pas au point de départ (×1,1 × 0,9 = ×0,99).
    - id: temps-vitesse-distance
      title: Temps, vitesse, distance
      strate: maitriser
      body: |
        Le grand classique des sélections de pilote — trois grandeurs liées
        par **d = v × t**. Le réflexe qui change tout : raisonner **par
        minute**.

        - 120 kt → **2 NM/min** ; 300 kt → 5 NM/min ; 420 kt → 7 NM/min
          (diviser les nœuds par 60) ;
        - 300 km/h → **5 km/min** ; 90 km/h → 1,5 km/min.

        Exemples :

        - 35 NM à 420 kt → 35 ÷ 7 = **5 min** ;
        - 12 min à 300 km/h → 12 × 5 = **60 km** ;
        - 18 NM en 6 min → 3 NM/min → **180 kt**.

        Convertir les **durées** en minutes avant de calculer (1 h 24 =
        84 min), et connaître les fractions d'heure usuelles — 15 min = ¼ h,
        20 min = ⅓ h, 45 min = ¾ h.
    - id: conversions-du-metier
      title: Les conversions et les règles du métier
      strate: maitriser
      body: |
        Les sélections mêlent au calcul pur des **conversions d'unités
        aéronautiques**. Elles ne se devinent pas : on les apprend une fois,
        avec un raccourci de calcul pour chacune.

        **Les facteurs, et comment les appliquer de tête**

        | Conversion | Facteur exact | Le raccourci mental | Exemple |
        | --- | --- | --- | --- |
        | Nœuds → km/h | × 1,852 | doubler, puis retirer 7,4 % | 300 kt → 600 − 44 = **556 km/h** |
        | km/h → nœuds | × 0,54 | la moitié, puis ajouter 8 % | 500 km/h → 250 + 20 = **270 kt** |
        | Pieds → mètres | × 0,3048 | × 0,3, puis ajouter 1,6 % | 9000 ft → 2700 + 43 = **2743 m** |
        | Mètres → pieds | × 3,281 | × 3, puis ajouter 9 % | 3000 m → 9000 + 810 ≈ **9800 ft** |
        | °C → °F | × 9/5 + 32 | doubler, retirer un dixième, ajouter 32 | 20 °C → 40 − 4 + 32 = **68 °F** |
        | °F → °C | (− 32) × 5/9 | retirer 32, la moitié, ajouter 10 % | 68 °F → 36 → 18 + 1,8 ≈ **20 °C** |

        Les deux raccourcis pieds/mètres sont justes à **mieux de 1 %** — plus
        que suffisant pour trancher entre quatre propositions, jamais pour un
        calcul de performance : là, on prend le facteur exact.

        Le **mille marin** vaut **1852 m**, soit **6076 ft** — c'est une minute
        d'arc de latitude, d'où la valeur choisie. Retenir « un mille ≈ 1,85 km
        et ≈ 6000 pieds » suffit pour la quasi-totalité des questions.

        **Le carburant** se traite comme une vitesse : une consommation en
        litres par heure devient une consommation **par minute** en divisant
        par 60. À 240 L/h, on brûle 4 L/min — donc 90 min de vol consomment
        360 L.

        **La règle du 1 en 60** — la plus rentable de toutes. Un écart de **1°
        de cap** creuse **1 mille marin** d'écart au bout de **60 milles**.
        D'où, pour toute distance : écart (NM) = angle (°) × distance (NM) ÷ 60.
        Trois degrés de travers sur 40 NM font donc 2 NM d'écart. La règle
        s'inverse pour corriger : dérivé de 3 NM après 30 NM, il faut reprendre
        3 × 60 ÷ 30 = 6°. C'est une **approximation**, excellente jusqu'à une
        vingtaine de degrés, moins au-delà.

        **La pente à 3 %** — l'approche standard. Un mille marin faisant
        6076 ft, une pente de 3° perd en toute rigueur 6076 × tan 3° ≈
        **318 ft par mille**, que l'on arrondit à **300 ft/NM** pour calculer
        de tête. D'où le point de descente : 9000 ft à perdre → 30 NM avant le
        terrain. Et le taux de descente correspondant vaut environ **cinq fois
        la vitesse sol** en nœuds — 120 kt donnent 600 ft/min.
  pieges:
    - Poser mentalement l'opération « comme à l'école » au lieu de décomposer — lent et source d'erreurs.
    - En temps-vitesse-distance, mélanger les unités (nœuds et minutes, km/h et secondes) — tout convertir avant de calculer.
    - +10 % puis −10 % ne ramène pas à la valeur initiale — les pourcentages successifs se multiplient, ils ne s'additionnent pas.
    - Négliger l'ordre de grandeur — une vérification d'une seconde qui évite les réponses absurdes.
    - Confondre le sens d'une conversion — un nombre de nœuds est toujours **plus petit** que le même trajet exprimé en km/h, et une altitude en mètres toujours plus petite qu'en pieds. Un coup d'œil au sens avant de calculer élimine la moitié des propositions.
    - Prendre les règles d'estimation pour des égalités — le 1 en 60 et les 300 ft/NM sont des approximations, commodes et volontairement arrondies (3° valent en réalité ≈ 318 ft/NM).
