summary: >-
  « A est à B ce que C est à … ? » Les analogies évaluent la capacité à
  identifier une relation entre deux termes, puis à la transposer fidèlement à
  un troisième. Le tout est de trouver la bonne règle.
objectifs:
  - Identifier la relation qui lie les deux premiers termes (opération, ordre de grandeur).
  - Transposer exactement cette relation au troisième terme.
  - Écarter les distracteurs qui appliquent une règle voisine mais fausse.
