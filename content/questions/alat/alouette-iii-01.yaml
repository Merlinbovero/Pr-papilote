  - Le Caracal
  - Le Tigre
  - Le NH90 Caïman
correctChoices: [0]
explanation: >-
  L'Alouette III (SA316), hélicoptère léger polyvalent monoturbine, fut un pilier
  de l'ALAT (1963-1999) — liaison, évacuation sanitaire et lutte antichar (SS11) —
  avant d'être remplacée par la Gazelle.
