explanation: Le F-14 Tomcat était l'intercepteur de défense de flotte de l'US Navy, doté du radar AWG-9 et du missile AIM-54 Phoenix. Ce n'est pas un appareil français ; il a été remplacé par le F/A-18 Super Hornet.
