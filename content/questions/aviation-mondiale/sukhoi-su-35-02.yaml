statement: Que signifie la « génération 4,5 » du Su-35 ?
choices:
  - Un chasseur très performant mais non furtif, évolution du Su-27
  - Un chasseur furtif de dernière génération
  - Un appareil sans pilote
  - Un prototype jamais mis en service
