explanation: Le Black Hawk (UH-60) est un hélicoptère de transport, à ne pas confondre avec l'Apache (AH-64), hélicoptère d'attaque — deux appareils américains différents. Le UH-60 a été rendu célèbre par la bataille de Mogadiscio (1993).
