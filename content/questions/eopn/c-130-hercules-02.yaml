explanation: Le C-130 Hercules est un avion de transport tactique quadrimoteur à turbopropulseurs (versions C-130H et C-130J), complément de l'A400M pour les terrains sommaires — il ne le remplace pas. Seuls les deux KC-130J ravitaillent en vol.
