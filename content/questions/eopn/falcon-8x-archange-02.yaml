explanation: 'L''Archange, dérivé du Falcon 8X et porteur de la charge utile CUGE de Thales, assure le renseignement électromagnétique (ROEM/SIGINT) : écouter et localiser les émissions. Il remplace les C-160 Gabriel et n''est pas armé.'
