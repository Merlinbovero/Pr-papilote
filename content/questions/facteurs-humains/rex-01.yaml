schemaVersion: 1
id: q.facteurs-humains.rex-01
kind: qcm
theme: culture-de-securite
statement: >-
  En France, quel est le rôle du BEA (Bureau d'enquêtes et d'analyses) après un
  accident aérien ?
choices:
  - Mener une enquête de sécurité pour comprendre et prévenir, sans chercher à punir
  - Juger et condamner les responsables
  - Indemniser les victimes
  - Réparer l'appareil accidenté
correctChoices: [0]
explanation: >-
  Le BEA conduit l'enquête de sécurité (comprendre les causes pour éviter que
  cela se reproduise), distincte de l'enquête judiciaire qui, elle, établit les
  responsabilités. C'est le cœur du retour d'expérience (REX).
evaluates: [fondamentaux.facteurs-humains.culture-de-securite-et-rex]
difficulty: 2
competencies: [connaissances-aeronautiques]
concours: [eopan, eopn, alat]
status: publie
