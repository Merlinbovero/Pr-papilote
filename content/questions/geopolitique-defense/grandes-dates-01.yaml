statement: >-
  En quelle année l'armée de l'Air française est-elle devenue une arme à part
  entière ?
choices:
  - "1934"
  - "1912"
  - "1945"
  - "1964"
correctChoices: [0]
explanation: >-
  L'armée de l'Air devient une arme à part entière le 2 juillet 1934. Avant
  cela, l'aviation militaire (créée par la loi de 1912) était une composante de
  l'armée de terre.
