statement: >-
  Quelle unité aérienne l'armée de terre crée-t-elle le 22 novembre 1954 ?
choices:
  - L'ALAT (aviation légère de l'armée de terre)
  - Les Forces aériennes stratégiques
  - L'aéronautique navale
  - L'armée de l'Air
correctChoices: [0]
explanation: >-
  L'ALAT, aviation légère de l'armée de terre, est créée le 22 novembre 1954 ;
  elle met en œuvre les hélicoptères et avions légers de l'armée de terre — la
  voie des pilotes ALAT.
