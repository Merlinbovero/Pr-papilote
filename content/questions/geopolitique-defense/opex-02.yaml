statement: >-
  L'opération Chammal est le volet français d'une coalition internationale.
  Contre quel adversaire, et dans quelle région ?
choices:
  - Contre Daech, en Irak puis en Syrie
  - Contre les groupes djihadistes au Sahel
  - Contre le régime libyen, en Libye
  - Contre la piraterie, dans le golfe d'Aden
correctChoices: [0]
explanation: >-
  Chammal (depuis le 19 septembre 2014) est le volet français de la coalition
  internationale contre Daech (l'« État islamique »), d'abord en Irak puis en
  Syrie. À ne pas confondre avec les opérations du Sahel (Serval, Barkhane).
