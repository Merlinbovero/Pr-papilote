statement: >-
  Quelle opération française, menée en 2011 en Libye, visait à protéger les
  populations sous mandat de l'ONU ?
choices:
  - Harmattan
  - Serval
  - Barkhane
  - Chammal
correctChoices: [0]
explanation: >-
  L'opération Harmattan (mars–octobre 2011) est l'intervention française en
  Libye pour protéger les populations, sous mandat de l'ONU et dans un cadre
  OTAN. Serval, Barkhane et Chammal sont postérieures et se déroulent ailleurs.
