statement: >-
  Quel instrument de base mesure la vitesse verticale (montée ou descente) de
  l'avion ?
choices:
  - Le variomètre
  - L'altimètre
  - L'anémomètre
  - Le conservateur de cap
correctChoices: [0]
explanation: >-
  Le variomètre indique la vitesse verticale (en pieds/minute), à ne pas
  confondre avec l'altimètre, qui indique l'altitude. Tous deux utilisent la
  prise statique.
