explanation: >-
  Guillaumet, Mermoz et Saint-Exupéry sont les trois grandes figures de
  l'Aéropostale (« la Ligne »). Guynemer et Fonck sont des as de la Première
  Guerre mondiale ; Garros et Blériot, des pionniers d'avant-guerre.
