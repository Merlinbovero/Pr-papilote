theme: guillaumet
statement: >-
  Dans quel massif montagneux Henri Guillaumet a-t-il survécu à un accident en
  marchant plusieurs jours dans la neige ?
choices:
  - La Cordillère des Andes
  - Le massif du Mont-Blanc
  - L'Himalaya
  - L'Atlas
correctChoices: [0]
explanation: >-
  En juin 1930, après un atterrissage forcé dans la Cordillère des Andes,
  Guillaumet marche cinq jours et quatre nuits avant d'être secouru — un exploit
  d'endurance raconté par Saint-Exupéry.
