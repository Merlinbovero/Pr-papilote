statement: >-
  Quel était le surnom de l'aviateur Jean Mermoz ?
choices:
  - « L'Archange »
  - « Le Vieux Charles »
  - « Le Cigogne »
  - « Le Baron rouge »
correctChoices: [0]
explanation: >-
  Jean Mermoz était surnommé « l'Archange ». « Le Vieux Charles » était l'avion
  de Guynemer, et « le Baron rouge » désigne l'as allemand Manfred von
  Richthofen.
