explanation: >-
  Saint-Exupéry fut à la fois pilote (Aéropostale, puis reconnaissance) et
  écrivain. Ses œuvres — « Vol de nuit », « Terre des hommes », « Le Petit
  Prince » — naissent de son expérience du vol.
