statement: >-
  Lequel de ces ouvrages a été écrit par Antoine de Saint-Exupéry ?
choices:
  - « Vol de nuit »
  - « Le Grand Cirque »
  - « Le Grand Meaulnes »
  - « L'Équipage »
correctChoices: [0]
explanation: >-
  « Vol de nuit » (1931, prix Femina) est de Saint-Exupéry. « Le Grand Cirque »
  est le récit de guerre de Pierre Clostermann ; « Le Grand Meaulnes » est
  d'Alain-Fournier.
