<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">
  <style>
    text { font: 16px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--schema-ink); }
    .sub { font-size: 15px; fill: var(--schema-muted); }
    .air { stroke: var(--schema-ink); fill: none; stroke-width: 3; }
    .sol { stroke: var(--schema-accent); fill: none; stroke-width: 3.5; }
    .vent { stroke: var(--schema-muted); fill: none; stroke-width: 3; stroke-dasharray: 7 4; }
    .repere { stroke: var(--schema-muted); fill: none; stroke-width: 1.5; }
    .arc { stroke: var(--schema-ink); fill: none; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="triangle-des-vitesses__f-air" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--schema-ink)" />
    </marker>
    <marker id="triangle-des-vitesses__f-sol" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--schema-accent)" />
    </marker>
    <marker id="triangle-des-vitesses__f-vent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--schema-muted)" />
    </marker>
    <marker id="triangle-des-vitesses__f-nord" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--schema-muted)" />
    </marker>
  </defs>

  <text class="sub" x="406" y="28" text-anchor="end">Exemple pédagogique — valeurs construites</text>

  <!-- ═══ ORIGINE COMMUNE ════════════════════════════════════════════════
       Nord, cap et route partent tous du MÊME point : c'est ce qui permet
       de lire les deux angles sur le même sommet, et la dérive comme leur
       différence. -->
  <line class="repere" x1="112" y1="140" x2="112" y2="60" marker-end="url(#triangle-des-vitesses__f-nord)" />
  <text class="sub" x="112" y="50" text-anchor="middle">N</text>

  <!-- Arc du cap : du Nord jusqu'au vecteur air, 90° -->
  <path class="arc" d="M112,84 A56,56 0 0,1 168,140" />
  <text class="sub" x="174" y="80" text-anchor="start">cap 090°</text>

  <!-- Arc de la route : du Nord jusqu'au vecteur sol, 104° -->
  <path class="arc" d="M112,62 A78,78 0 0,1 187.7,158.9" />

  <!-- Vitesse propre : O → A. 120 kt au cap 090°, échelle 1,6 unité/nœud. -->
  <line class="air" x1="112" y1="140" x2="304" y2="140" marker-end="url(#triangle-des-vitesses__f-air)" />
  <text x="230" y="126" text-anchor="middle">Vp 120 kt</text>

  <!-- Vent : A → B, tête-à-queue. Nommé par sa PROVENANCE, tracé vers où
       l'air VA — les deux mentions figurent côte à côte pour que l'écart
       ne puisse pas être lu à l'envers. -->
  <line class="vent" x1="304" y1="140" x2="304" y2="188" marker-end="url(#triangle-des-vitesses__f-vent)" />
  <text class="sub" x="314" y="154" text-anchor="start">vent 30 kt</text>
  <text class="sub" x="314" y="176" text-anchor="start">du 360°</text>
  <text class="sub" x="314" y="198" text-anchor="start">vers 180°</text>

  <!-- Vitesse sol : O → B, somme vectorielle exacte -->
  <line class="sol" x1="112" y1="140" x2="304" y2="188" marker-end="url(#triangle-des-vitesses__f-sol)" />
  <text x="14" y="206" text-anchor="start">Vs ≈ 124 kt · route ≈ 104°</text>

  <!-- Dérive : lue dans l'ouverture entre les deux vecteurs, là où elle
       est la plus large — près des pointes, pas au sommet. -->
  <path class="arc" d="M232,140 A120,120 0 0,1 228.4,169.1" />
  <text class="sub" x="196" y="170" text-anchor="start">dérive +14°</text>

  <text class="sub" x="14" y="228" text-anchor="start">Vs = Vp + Vvent · même échelle</text>
</svg>
