<svg xmlns="http://www.w3.org/2000/svg" data-charte="croquis" viewBox="0 0 380 210" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <!--
    Croquis technique — pilote, direction B.

    `data-charte="croquis"` sur la racine : le fichier DÉCLARE lui-même son
    adhésion à la charte commune, servie par `FicheFigure`
    (src/styles/croquis.css). Aucune feuille locale, aucune couleur en dur.

    La détection a d'abord été inférée — « le fichier ne contient pas de
    feuille locale » — et ce commentaire-ci, qui citait la balise en toutes
    lettres, suffisait à la mettre en défaut. Une adhésion se déclare, elle
    ne se devine pas.

    Le titre et les trois
    formules sont SORTIS du dessin et rendus en HTML sous la figure : gravés
    ici, ils ne se sélectionnaient pas, ne se traduisaient pas, et leur
    13 px fixe tombait sous 5 px une fois la figure réduite sur mobile.

    Ne restent que les repères indissociables de la géométrie — D, V, t —
    dont la position EST l'information.
  -->
  <path class="trait" d="M190,20 L86,162 L294,162 Z" />
  <line class="trait-fin" x1="138" y1="91" x2="242" y2="91" />
  <line class="trait-fin" x1="190" y1="91" x2="190" y2="162" />
  <text class="repere" x="190" y="72" text-anchor="middle">D</text>
  <text class="repere" x="160" y="138" text-anchor="middle">V</text>
  <text class="repere" x="220" y="138" text-anchor="middle">t</text>
  <text class="repere-petit" x="190" y="190" text-anchor="middle">distance · vitesse · temps</text>
</svg>
